name: Build

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "web/**"
      - "data/**"
      - "scripts/**"
      - "Dockerfile"
      - "package*.json"
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC token exchange
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/solidsnake:${{ github.sha }}

jobs:
  # --------------------------------------------------------------------------
  # Build, scan, push, report the digest to feed infra-up
  # --------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: docker buildx build --load --tag "$IMAGE" .

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push
        run: docker push "$IMAGE"

      - name: Digest to summary
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$digest\`" >> "$GITHUB_STEP_SUMMARY"
