  - CKV2_AZURE_21
  # azurerm 5 uses public_network_access = "Disabled"; the check still reads the removed boolean
  # The state account must accept GitHub runners; it is Entra-only, shared keys off
  - CKV_AZURE_59
  - CKV2_AZURE_33
  # ZRS is enough for synthetic data that lives one demo
  - CKV_AZURE_206
  # Platform-managed encryption keys are enough for synthetic data
  - CKV2_AZURE_1
