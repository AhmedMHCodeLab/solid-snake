  - CKV2_AZURE_38
  - CKV_AZURE_110
  - CKV_AZURE_42
  # Registry is Basic: these need Premium; images are scanned by Trivy in build.yml and pulled by identity (ADR 0009)
  - CKV_AZURE_139
  - CKV_AZURE_163
  - CKV_AZURE_164
  - CKV_AZURE_165
